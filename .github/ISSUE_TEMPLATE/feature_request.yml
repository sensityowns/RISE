name: Feature request
description: Suggest a safe improvement to RISE
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like RISE to do?
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Possible risks or tradeoffs
      description: Include any system changes, permissions, or restart requirements you expect.
    validations:
      required: false
